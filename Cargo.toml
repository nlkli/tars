[package]
name = "tars"
version = "0.1.0"
edition = "2024"

[dependencies]
llm-provider-models = { path = "./llm-provider-models" }
anyhow = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
serde = { version="1", features = ["derive"] }
serde_json = "1"
minijinja = "2"
portable-pty = "0.9"
strip-ansi-escapes = "0.2"
sysinfo = "0.39"
